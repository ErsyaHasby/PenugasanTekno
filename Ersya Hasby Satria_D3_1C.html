<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penugasan Tekno</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: "Poppins", sans-serif;
            text-align: center;
            overflow: hidden;
            background-color: aqua;
            background-size: cover;
        }

        .container {
            background: #ffffff;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            width: 80%;
            max-width: 400px;
            overflow: hidden;
            position: relative;
        }

        .emoji {
            font-size: 50px;
            animation: bounce 1s infinite alternate;
        }

        @keyframes bounce {
            0% {
                transform: translateY(0);
            }

            100% {
                transform: translateY(-10px);
            }
        }

        button {
            background-color: #228B22;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
        }

        button:hover {
            background-color: #006400;
        }
    </style>
</head>

<br>

<div class="container">
    <div class="emoji">⚽🔥</div>
    <p id="message">ERSYA HASBY SATRIA! D3 1C⚽</p>

    <button onclick="changeMessage()">Klik untuk lanjut</button>

    <audio id="backsound" loop>
        <source src="https://raw.githubusercontent.com/ErsyaHasby/PenugasanTekno/refs/heads/main/soo.mp3"
            type="audio/mp3">
        Browser kamu tidak mendukung elemen audio.
    </audio>
</div>

<script>
    const messages = [
        "Kenapa memilih Unit Tekno? ⚙️  Karena saya ingin mengembangkan minat dan skill coding saya  ",
        "Minat kamu di Frontend atau Backend? 💻 Frontend karena belum mencoba backend  ",
        "Pernah coba desain aplikasi? 🎨 belum   ",
        "Pernah ngerjain proyek? Share dong! https://github.com/ErsyaHasby 🚀   "
    ];
    const audio = document.getElementById("backsound");
    const messageElement = document.getElementById("message");
    const finalMessage = document.getElementById("finalMessage");
    const restartButton = document.getElementById("restartButton");
    const changeMessageButton = document.querySelector("button");

    function startAudio() {
        audio.play().catch(error => console.log("Autoplay tidak diizinkan:", error));
        document.removeEventListener("click", startAudio);
    }
    document.querySelector("button").addEventListener("click", function () {
        audio.play().catch(error => console.log("Autoplay tidak diizinkan:", error));
    });
    let index = 0;
    function changeMessage() {
        if (index < messages.length) {
            document.getElementById("message").textContent = messages[index];
            index++;
        } else {
            document.getElementById("message").textContent = "Terlalu sederhana hehe 🎉";
        }

    }


</script>
</body>

</html>
